name: CI/CD - Sync Staging to Production

# Trigger: When code is pushed to the 'staging' branch
on:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  # Job 1: CI (Continuous Integration) - Run Tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx  # <--- Make sure these are installed

      - name: Run Tests
        env:
            # Mock env vars so tests don't crash
            SECRET_KEY: "404a20b4150fd1c177d3dddffaa8a546bc66e8419b11f7dec2030f8c562209e7"
            ALGORITHM: "HS256"
            SUPABASE_URL: "https://eirlkzghvgzkhxwjxwzk.supabase.co"
            SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpcmxremdodmd6a2h4d2p4d3prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MDY4OTgsImV4cCI6MjA4NDQ4Mjg5OH0.p9HDefe0RDDHV3iL53RbZUaNfG1KakOhKKub9-TrBYk"
        run: |
          cd backend
          pytest

  # Job 2: CD (Continuous Deployment) - Auto Merge
  deploy-to-production:
    needs: test # Only run if tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Production
        uses: actions/checkout@v3
        with:
          ref: production # Checkout target branch
          fetch-depth: 0  # Fetch full history for merge

      - name: Configure Git Bot
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Merge Staging into Production
        run: |
          # Pull latest staging
          git fetch origin staging
          git checkout staging
          git checkout production
          
          # Merge Staging into Production
          git merge staging --no-edit -m "🚀 Auto-deploy: Merged staging into production"
          
          # Push to Production
          git push origin production